[package]
name = "server"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.98"

categories = ["simulation"]
keywords = ["applicants", "education"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/abit-rs"

[lints]
workspace = true

[dependencies]
scraper = { path = "../scraper" }

chrono = "0.4.45"
fern = "0.7.1"
log = "0.4.33"
o2o = "0.5.5"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
strum = "0.28.0"
strum_macros = "0.28.0"
sqlx = { version = "0.9.0", features = [ "macros", "postgres", "runtime-tokio", "json", "bigdecimal" ] }
