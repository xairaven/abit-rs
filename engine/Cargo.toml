[package]
name = "engine"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.97.1"

categories = ["simulation"]
keywords = ["applicants", "education"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/abit-rs"

[lints]
workspace = true

[dependencies]
aes = "0.9.2"
async-trait = "0.1.92"
base64 = "0.23.1"
bigdecimal = "0.4.10"
block-padding = "0.4.2"
cbc = "0.2.1"
log = "0.4.33"
num_enum = "0.7.6"
num-traits = "0.2.19"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "form"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
strum = "0.28.0"
strum_macros = "0.28.0"
sqlx = { version = "0.9.0", features = [ "macros", "postgres", "runtime-tokio", "json", "bigdecimal" ] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
