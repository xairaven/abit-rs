[package]
name = "scraper"
version = "0.0.1"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]

edition = "2024"
rust-version = "1.98"

categories = ["simulation"]
keywords = ["applicants", "education"]

readme = "../README.md"
license = "MIT"
repository = "https://github.com/xairaven/abit-rs"

[lints]
workspace = true

[dependencies]
model = { path = "../model" }

log = "0.4.33"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = "0.28.0"
sqlx = { version = "0.9.0", features = [ "macros", "postgres", "runtime-tokio", "json", "bigdecimal" ] }
thiserror = "2.0.20"
